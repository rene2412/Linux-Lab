<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Linux-Lab</title>
    <link rel="icon" type="image/x-icon" href="../assets/SVGs/favicon.ico" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="settingModal.css" />
  </head>
  <body>
    <div class="navigation__container"></div>

    <!-- SETTINGS -->
    <dialog class="setting__container">
      <div class="setting__header">
        <h2>Settings</h2>
        <button class="setting__button--close setting__button">
          <img src="../assets/SVGs/Close.svg" alt="close" />
        </button>
      </div>
      <div class="setting__content">
        <form
          class="setting__form setting__form--email setting__item"
          action="#"
          method="POST"
        >
          <h4 class="setting__form__title">Change Email</h4>
          <label for="oldEmail">Enter current Email:</label>
          <input
            class="input--single"
            placeholder="currentEmail@domain.com"
            id="oldEmail"
            name="oldEmail"
            type="email"
            required
          />
          <label for="newEmail">Enter new Email:</label>
          <input
            placeholder="email@domain.com"
            id="newEmail"
            name="newEmail"
            type="email"
            class="input--single"
            required
          />
          <button class="form__button--cpwd styled-button" type="submit">
            Change Email
          </button>
          <p class="status"></p>
        </form>
        <form
          class="setting__form setting__form--name setting__item"
          action="#"
          method="POST"
        >
          <h4 class="setting__form__title">Change Username</h4>
          <label for="oldName">Enter current username</label>
          <input
            class="input--single"
            placeholder="current Username"
            id="oldName"
            name="oldName"
            type="text"
            required
          />
          <label for="newName">Enter new Email:</label>
          <input
            placeholder="New Username"
            id="newName"
            name="newName"
            type="text"
            class="input--single"
            required
          />
          <button class="form__button--name styled-button" type="submit">
            Change Name
          </button>
          <p class="status "></p>
        </form>
        <div class="setting__item">
          <h4 class="setting__form__title">Delete Account:</h4>
          <button
            type="button"
            class="setting__button setting__button--delete styled-button"
          >
            Delete
          </button>
        </div>
      </div>
    </dialog>

    <!-- LAYOUT -->
    <div class="layout">
      <div class="sidebar__placeholder"></div>
      <main class="dashboard__container">
        <p class="greeting__text">Loading...</p>
      </main>
    </div>

    <script src="dashboard.js" type="module"></script>
    <script>
      const modal = document.querySelector(".setting__container");
      const closeBtn = modal.querySelector(".setting__button--close");

      const emailForm = document.querySelector(".setting__form--email");
      const usernameForm = document.querySelector(".setting__form--name");

      console.log(emailForm);
      console.log(usernameForm);

      emailForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData);
        console.log(data);

        try {
          const response = await fetch("../../user/change_email.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              new_email: data.newEmail,
              old_email: data.oldEmail,
            }),
          });
          if (!response.ok) {
            throw new Error ("Bad response form send");
          }
          const resData = await response.json();
          console.log(resData);
        } catch (e) {
          console.error(e);
        }
      });

      closeBtn.addEventListener("click", () => {
        modal.close();
      });
      // modal.showModal();
    </script>
  </body>
</html>
