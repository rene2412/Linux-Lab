<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Global Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="navigation__container"></div>
    <div class="layout">
      <article class="min-h-svh h-svh text-white !p-10">
        <div
          class="flex flex-col bg-black justify-between outline-2 outline-[var(--color-secondary)] rounded-sm w-full h-[80%]"
        >
          <!-- TOP -->
          <div
            class="bg-black border-b-2 flex justify-center items-center !py-2"
          >
            <h2 class="text-2xl font-extrabold">Global Chat</h2>
          </div>
          <!-- CHAT BOX HERE -->
          <article class="overflow-y-scroll">
            <div class="h-[1000px] !px-5">
              <div class=" flex flex-col">
                <div class="message__row max-w-[80%] flex flex-col gap-2">
                  <div
                    class="message__header flex justify-between items-center !-mb-2"
                  >
                    <p class="green">@herb</p>
                    <p class="text-sm text-[var(--text-color-secondary)] ">5-16-2025 16:09</p>
                  </div>
                  <div
                    class="message !p-2 bg-[var(--color-overlay)] w-fit rounded-[var(--radius-med)]"
                  >
                    Hello World!
                  </div>
                </div>
                <div class="message__row max-w-[80%] flex flex-col items-end self-end  gap-2">
                  <div
                    class="message__header flex justify-between items-center !-mb-2"
                  >
                    <p class="text-xs text-[var(--text-color-secondary)]">5-16-2025 16:09</p>
                  </div>
                  <div
                    class="message !p-2 bg-[var(--color-highlight)] w-fit rounded-[var(--radius-med)]"
                  >
                    Hello World!
                  </div>
                </div>
              </div>
            </div>
          </article>
          <!-- INPUT UI -->
          <form
            id="chatForm"
            action="global_chat.php"
            method="POST"
            class="h-fit w-full !p-4"
          >
            <div
              class="h-fit w-full gap-4 bg-[var(--color-overlay)] flex items-center outline-0 rounded-xl !p-2"
            >
              <textarea
                name="comment"
                placeholder="Post A Comment ..."
                class="!animate-none resize-none input--single !max-h-40 !w-full !max-w-none field-sizing-content overflow-auto"
              ></textarea>
              <button class="styled-button" type="submit">Send</button>
            </div>
          </form>
        </div>
      </article>
    </div>
    <footer class="footer__container"></footer>
    <script type="module" src="chat.js"></script>
  </body>
</html>
