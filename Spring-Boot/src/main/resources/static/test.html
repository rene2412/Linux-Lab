<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bash Scripting - Linux Terminal Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu Mono', 'Fira Code', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            min-height: 100vh;
            color: #00ff00;
            overflow: hidden;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.05;
        }

        .matrix-char {
            position: absolute;
            color: #00ff00;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 14px;
            animation: matrix-fall linear infinite;
        }

        @keyframes matrix-fall {
            0% { transform: translateY(-100vh); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .container {
            display: flex;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            padding: 15px 30px;
            z-index: 1000;
            border-bottom: 2px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 2px 20px rgba(0, 255, 0, 0.2);
            position: relative;
        }

        .bash-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 10px #00ff00);
            animation: logo-glow 2s ease-in-out infinite;
        }

        @keyframes logo-glow {
            0%, 100% { filter: drop-shadow(0 0 10px #00ff00); }
            50% { filter: drop-shadow(0 0 20px #00ff00) drop-shadow(0 0 30px #00ff00); }
        }

        .bash-symbol {
            font-size: 2.5em;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px #00ff00; }
            50% { text-shadow: 0 0 30px #00ff00, 0 0 40px #00ff00; }
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #00ff00; }
        }

        .terminal-info {
            position: absolute;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #00ff00;
            font-size: 14px;
        }

        .split-container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 100px;
        }

        .lesson-panel {
            width: 50%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border-right: 2px solid #00ff00;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .lesson-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 20px;
            border-bottom: 1px solid #00ff00;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lesson-title {
            font-size: 1.5em;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 0 5px #00ff00;
        }

        .lesson-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            color: #cccccc;
            line-height: 1.6;
            font-size: 14px;
        }

        .lesson-content::-webkit-scrollbar {
            width: 8px;
        }

        .lesson-content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .lesson-content::-webkit-scrollbar-thumb {
            background: #666666;
            border-radius: 4px;
        }

        .lesson-content::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
        }

        .lesson-section {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #666666;
            border-radius: 5px;
        }

        .lesson-section h3 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 1.1em;
            text-shadow: 0 0 5px #00ff00;
        }

        .lesson-placeholder {
            text-align: center;
            padding: 40px 20px;
            color: #888888;
        }

        .lesson-placeholder h3 {
            color: #00ff00;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .lesson-placeholder p {
            color: #cccccc;
            font-size: 16px;
            line-height: 1.6;
        }

        .lesson-navigation {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 15px 20px;
            border-top: 1px solid #333333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 20px;
            border: 2px solid #666666;
            border-radius: 8px;
            background: transparent;
            color: #cccccc;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            font-family: 'Ubuntu Mono', monospace;
        }

        .nav-btn:hover {
            border-color: #00ff00;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .nav-btn:disabled {
            border-color: #333333;
            color: #333333;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            border-color: #333333;
            color: #333333;
            box-shadow: none;
        }

        .lesson-counter {
            color: #cccccc;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 14px;
            font-weight: 600;
        }

        .lesson-counter span {
            color: #00ff00;
        }

        .code-example {
            background: #000000;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333333;
            font-family: 'Ubuntu Mono', monospace;
            margin: 10px 0;
            color: #00ff00;
        }

        .editor-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .editor-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 20px;
            border-bottom: 1px solid #00ff00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-size: 1.5em;
            color: #ffffff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 5px #00ff00;
        }

        .editor-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #00ff00;
            border-radius: 8px;
            background: transparent;
            color: #00ff00;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            font-family: 'Ubuntu Mono', monospace;
        }

        .btn:hover {
            background: #00ff00;
            color: #000000;
            box-shadow: 0 0 20px #00ff00;
            transform: translateY(-2px);
        }

        .btn-run {
            border-color: #00ff00;
            animation: terminal-blink 1s infinite;
        }

        @keyframes terminal-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.7; }
        }

        .btn-run.running {
            animation: running-pulse 0.5s infinite;
        }

        @keyframes running-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .editor-wrapper {
            flex: 1;
            padding: 20px;
            background: #000000;
        }

        #editor {
            width: 100%;
            height: 100%;
            border: 2px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .output {
            height: 200px;
            background: #000000;
            border-top: 2px solid #00ff00;
            display: none;
            flex-direction: column;
        }

        .output-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 10px 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00ff00;
            border-bottom: 1px solid #00ff00;
        }

        .output-content {
            flex: 1;
            padding: 15px;
            color: #00ff00;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-y: auto;
            background: #000000;
        }

        .output-content::-webkit-scrollbar {
            width: 8px;
        }

        .output-content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .output-content::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }

        .status-bar {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            padding: 10px 20px;
            border-top: 1px solid #00ff00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #00ff00;
        }

        .status-left {
            display: flex;
            gap: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-value {
            color: #00ff00;
            font-weight: 600;
            text-shadow: 0 0 5px #00ff00;
        }

        .file-input {
            display: none;
        }

        .terminal-prompt {
            color: #00ff00;
            font-weight: bold;
        }

        .loading-animation {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 1024px) {
            .split-container {
                flex-direction: column;
                padding-top: 120px;
            }
            
            .lesson-panel,
            .editor-panel {
                width: 100%;
            }
            
            .lesson-panel {
                height: 40vh;
                border-right: none;
                border-bottom: 2px solid #00ff00;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .bash-logo {
                width: 50px;
                height: 50px;
            }
        }

        /* Matrix rain effect */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <div class="matrix-bg" id="matrixBg"></div>
    
    <div class="header">
        <div class="bash-symbol">$</div>
        <img src="images/bash.png" alt="Bash Logo" class="bash-logo">
        <h1>Bash Scripting</h1>
        <div class="terminal-info">
            <span> Ubuntu 22.04 LTS</span>
            <span id="currentTime"></span>
        </div>
    </div>

    <div class="container">
        <div class="split-container">
            <div class="lesson-panel">
                <div class="lesson-header">
                    <div class="lesson-title">Interactive Bash Lessons</div>
                </div>
                <div class="lesson-content" id="lessonContent">
                    <!-- Lesson content will be dynamically loaded here -->
                    <div class="lesson-placeholder">
                        <h3> echo</h3>
                        <p>Lessons will be displayed here!.</p>
                    </div>
                </div>
                
                <div class="lesson-navigation">
                    <button class="nav-btn nav-prev" onclick="previousLesson()">
                        <span>◀</span>
                        <span>Previous</span>
                    </button>
                    <div class="lesson-counter">
                        <span id="currentLesson">1</span> / <span id="totalLessons">10</span>
                    </div>
                    <button class="nav-btn nav-next" onclick="nextLesson()">
                        <span>Next</span>
                        <span>▶</span>
                    </button>
                </div>
            </div>

            <div class="editor-panel">
                <div class="editor-header">
                    <div class="editor-title">
                        <span>script.sh</span>
                    </div>
                    
                    <div class="editor-controls">
                        <button class="btn btn-run" onclick="runCode()">
                            <span>▶</span>
                            <span>Run</span>
                        </button>
                        
                        <button class="btn btn-save" onclick="saveFile()">
                            <span>💾</span>
                            <span>Save</span>
                        </button>
                        
                        <button class="btn btn-load" onclick="loadFile()">
                            <span>📁</span>
                            <span>Load</span>
                        </button>
                        
                        <button class="btn btn-clear" onclick="clearEditor()">
                            <span>🗑</span>
                            <span>Clear</span>
                        </button>
                    </div>
                </div>
                
                <div class="editor-wrapper">
                    <div id="editor">#!/bin/bash
echo "🐧 Welcome to Linux Bash Scripting!"
</div>
                </div>
                
                <div class="output" id="output">
                    <div class="output-header">
                        <span>💻</span>
                        <span>Terminal Output</span>
                        <div class="loading-animation" id="loadingSpinner" style="display: none;"></div>
                    </div>
                    <div class="output-content" id="outputContent"></div>
                </div>
                
                <div class="status-bar">
                    <div class="status-left">
                        <div class="status-item">
                            <span>Line: <span class="status-value" id="lineNumber">1</span></span>
                        </div>
                        <div class="status-item">
                            <span>Col: <span class="status-value" id="columnNumber">1</span></span>
                        </div>
                        <div class="status-item">
                            <span>Bash: <span class="status-value">5.1.16</span></span>
                        </div>
                    </div>
                    <div class="status-right">
                        <span class="terminal-prompt">$ ready_to_execute</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" class="file-input" id="fileInput" accept=".sh,.bash,.txt" onchange="handleFileLoad()">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ext-language_tools.js"></script>
    <script>
        // Initialize ACE editor
        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/terminal");
        editor.session.setMode("ace/mode/sh");
        editor.setOptions({
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            enableSnippets: true,
            fontSize: "14px",
            showPrintMargin: false,
            highlightActiveLine: true,
            highlightSelectedWord: true
        });

        // Update current time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('currentTime').textContent = timeString;
        }

        // Matrix rain effect
        function createMatrixRain() {rene2412@rene2412-L1:/var/www/html/Linux-Lab$ ls
            api_commands.php  composer.json  correct_output.php  images    index.html   perms.sh   sales.py     src       test_autoload.php  test.php
            Command_Line      composer.lock  documentation       includes  network.php  README.md  Spring-Boot  terminal  test_email.php     vendor
            rene2412@rene2412-L1:/var/www/html/Linux-Lab$ 
            
            for (let i = 0; i < 50; i++) {
                const char = document.createElement('div');
                char.className = 'matrix-char';
                char.textContent = chars[Math.floor(Math.random() * chars.length)];
                char.style.left = Math.random() * 100 + '%';
                char.style.animationDuration = (Math.random() * 3 + 2) + 's';
                char.style.animationDelay = Math.random() * 2 + 's';
                matrixBg.appendChild(char);
            }
        }

        // Initialize everything
        updateTime();
        setInterval(updateTime, 1000);
        createMatrixRain();

        // Placeholder functions for buttons
        function runCode() {
            console.log("Running code...");
        }

        function saveFile() {
            console.log("Saving file...");
        }

        function loadFile() {
            console.log("Loading file...");
        }

        function clearEditor() {
            editor.setValue("");
        }

        function previousLesson() {
            console.log("Previous lesson");
        }

        function nextLesson() {
            console.log("Next lesson");
        }

        function handleFileLoad() {
            console.log("File loaded");
        }
    </script>
</body>
</html>
