<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bash Scripting - Linux Terminal Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu Mono', 'Fira Code', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            min-height: 100vh;
            color: #00ff00;
            overflow: hidden;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.05;
        }

        .matrix-char {
            position: absolute;
            color: #00ff00;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 14px;
            animation: matrix-fall linear infinite;
        }

        @keyframes matrix-fall {
            0% { transform: translateY(-100vh); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .container {
            display: flex;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            padding: 15px 30px;
            z-index: 1000;
            border-bottom: 2px solid #00ff00;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 20px rgba(0, 255, 0, 0.2);
        }

        .bash-symbol {
            font-size: 2.5em;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px #00ff00; }
            50% { text-shadow: 0 0 30px #00ff00, 0 0 40px #00ff00; }
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #00ff00; }
        }

        .terminal-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #00ff00;
            font-size: 14px;
        }

        .split-container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 80px;
        }

        .lesson-panel {
            width: 50%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border-right: 2px solid #00ff00;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .lesson-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 20px;
            border-bottom: 1px solid #00ff00;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lesson-title {
            font-size: 1.5em;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 0 5px #00ff00;
        }

        .lesson-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            color: #cccccc;
            line-height: 1.6;
            font-size: 14px;
        }

        .lesson-content::-webkit-scrollbar {
            width: 8px;
        }

        .lesson-content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .lesson-content::-webkit-scrollbar-thumb {
            background: #666666;
            border-radius: 4px;
        }

        .lesson-content::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
        }

        .lesson-section {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #666666;
            border-radius: 5px;
        }

        .lesson-section h3 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 1.1em;
            text-shadow: 0 0 5px #00ff00;
        }

        .lesson-placeholder {
            text-align: center;
            padding: 40px 20px;
            color: #888888;
        }

        .lesson-placeholder h3 {
            color: #00ff00;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .lesson-placeholder p {
            color: #cccccc;
            font-size: 16px;
            line-height: 1.6;
        }

        .lesson-navigation {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 15px 20px;
            border-top: 1px solid #333333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 20px;
            border: 2px solid #666666;
            border-radius: 8px;
            background: transparent;
            color: #cccccc;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            font-family: 'Ubuntu Mono', monospace;
        }

        .nav-btn:hover {
            border-color: #00ff00;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .nav-btn:disabled {
            border-color: #333333;
            color: #333333;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            border-color: #333333;
            color: #333333;
            box-shadow: none;
        }

        .lesson-counter {
            color: #cccccc;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 14px;
            font-weight: 600;
        }

        .lesson-counter span {
            color: #00ff00;
        }

        .code-example {
            background: #000000;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333333;
            font-family: 'Ubuntu Mono', monospace;
            margin: 10px 0;
            color: #00ff00;
        }

        .editor-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .editor-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 20px;
            border-bottom: 1px solid #00ff00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-size: 1.5em;
            color: #ffffff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 5px #00ff00;
        }

        .editor-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #00ff00;
            border-radius: 8px;
            background: transparent;
            color: #00ff00;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            font-family: 'Ubuntu Mono', monospace;
        }

        .btn:hover {
            background: #00ff00;
            color: #000000;
            box-shadow: 0 0 20px #00ff00;
            transform: translateY(-2px);
        }

        .btn-run {
            border-color: #00ff00;
            animation: terminal-blink 1s infinite;
        }

        @keyframes terminal-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.7; }
        }

        .btn-run.running {
            animation: running-pulse 0.5s infinite;
        }

        @keyframes running-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .editor-wrapper {
            flex: 1;
            padding: 20px;
            background: #000000;
        }

        #editor {
            width: 100%;
            height: 100%;
            border: 2px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .output {
            height: 200px;
            background: #000000;
            border-top: 2px solid #00ff00;
            display: none;
            flex-direction: column;
        }

        .output-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 10px 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00ff00;
            border-bottom: 1px solid #00ff00;
        }

        .output-content {
            flex: 1;
            padding: 15px;
            color: #00ff00;
            font-family: 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-y: auto;
            background: #000000;
        }

        .output-content::-webkit-scrollbar {
            width: 8px;
        }

        .output-content::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .output-content::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }

        .status-bar {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            padding: 10px 20px;
            border-top: 1px solid #00ff00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #00ff00;
        }

        .status-left {
            display: flex;
            gap: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-value {
            color: #00ff00;
            font-weight: 600;
            text-shadow: 0 0 5px #00ff00;
        }

        .file-input {
            display: none;
        }

        .terminal-prompt {
            color: #00ff00;
            font-weight: bold;
        }

        .loading-animation {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 1024px) {
            .split-container {
                flex-direction: column;
            }
            
            .lesson-panel,
            .editor-panel {
                width: 100%;
            }
            
            .lesson-panel {
                height: 40vh;
                border-right: none;
                border-bottom: 2px solid #00ff00;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }

        /* Matrix rain effect */
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <div class="matrix-bg" id="matrixBg"></div>
    
    <div class="header">
        <div class="bash-symbol">$</div>
        <!--<img src=".././../../../images/bash.png" alt="Bash Logo" class="bash-logo"> -->

                <div class="editor-wrapper">

echo "🐧 Welcome to Linux Bash Scripting!"

    <input type="file" class="file-input" id="fileInput" accept=".sh,.bash,.txt" onchange="handleFileLoad()">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ext-language_tools.js"></script>
    
    <script>

        // Initialize Matrix Rain Effect
        function createMatrixRain() {
            const matrixBg = document.getElementById('matrixBg');
            const chars = '01abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            for (let i = 0; i < 50; i++) {
                const char = document.createElement('div');
                char.className = 'matrix-char';
                char.textContent = chars[Math.floor(Math.random() * chars.length)];
                char.style.left = Math.random() * 100 + '%';
                char.style.animationDuration = (Math.random() * 3 + 2) + 's';
                char.style.animationDelay = Math.random() * 2 + 's';
                matrixBg.appendChild(char);
            }
        }

        // Update current time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('currentTime').textContent = `${timeString}`;
        }

        // Initialize Ace Editor
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/terminal");
        editor.session.setMode("ace/mode/sh");
        editor.setOptions({
            enableBasicAutocompletion: true,
            enableSnippets: true,
            enableLiveAutocompletion: true,
            fontSize: 14,
            showPrintMargin: false,
            wrap: true,
            tabSize: 2,
            useSoftTabs: true,
            cursorStyle: "wide"
        });

        // Update status bar
        function updateStatus() {
            const cursor = editor.getCursorPosition();
            document.getElementById('lineNumber').textContent = cursor.row + 1;
            document.getElementById('columnNumber').textContent = cursor.column + 1;
        }

        editor.on('changeSelection', updateStatus);
        editor.on('changeCursor', updateStatus);




// DO NOT TOUCH THIS FUNCTION
//Function will run code and send it the backend to Spring Boot for docker containment
async function runCode() {
    const code = editor.getValue().trim();
    const runButton = document.querySelector('.btn-run');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const output = document.getElementById('output');
    const outputContent = document.getElementById('outputContent');
    
    if (!code) {
        alert('Please write a bash script first!');
        return;
    }

    // Show loading state
    runButton.classList.add('running');
    runButton.innerHTML = '<span>Executing...</span>';
    loadingSpinner.style.display = 'inline-block';
    
    // Show output container
    output.style.display = 'block';
    outputContent.textContent = 'Executing script...\n';

    try {
        console.log('Sending script to backend:', code); // Debug log
        
        // Send code to Spring Boot backend
        const response = await fetch('/api/script', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ script: code })
        });

        console.log('Response status:', response.status); // Debug log

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
        }

        const result = await response.json();
        console.log('Backend response:', result); // Debug log
        
        // Clear previous output
        outputContent.textContent = '';
        
        // Display result
        if (result.output && result.output.length > 0) {
            outputContent.textContent += result.output;
        } else {
           // outputContent.textContent += ' Output:\n(No output produced)';
        }
        
        if (result.error && result.error.length > 0) {
            outputContent.textContent += '\n\n' + result.error;
        }
        
        // Show execution status
        if (result.success !== undefined) {
            if (result.success) {
                outputContent.textContent += '\n\n\n\nScript executed successfully!';
            } else {
                outputContent.textContent += `\n\n\n\nScript failed with exit code: ${result.exitCode || 'unknown'}`;
            }
        }
        
        if (result.executionTime) {
            outputContent.textContent += `\nExecution time: ${result.executionTime}ms`;
        }
        
    } catch (error) {
        console.error('Error executing script:', error);
        outputContent.textContent = '';
        outputContent.textContent += 'Connection Error:\n' + error.message;
        outputContent.textContent += '\n\n Falling back to simulation mode...\n\n';
        
        // Fallback to simulation if backend is not available
        const simulatedOutput = simulateAdvancedBash(code);
        outputContent.textContent += simulatedOutput;
        
    } finally {
        // Reset button and spinner
        runButton.classList.remove('running');
        runButton.innerHTML = '<span>▶</span><span>Execute</span>';
        loadingSpinner.style.display = 'none';
        
        // Scroll to bottom
        outputContent.scrollTop = outputContent.scrollHeight;
    }
}

       
        // Save file
        function saveFile() {
            const content = editor.getValue();
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'script.sh';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Load file
        function loadFile() {
            document.getElementById('fileInput').click();
        }

        function handleFileLoad() {
            const file = document.getElementById('fileInput').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    editor.setValue(e.target.result);
                    editor.clearSelection();
                    updateStatus();
                };
                reader.readAsText(file);
            }
        }

        // Clear editor
        function clearEditor() {
            if (confirm('Are you sure you want to clear the editor?')) {
                editor.setValue('#!/bin/bash\n# Write your bash script here\n\n');
                editor.clearSelection();
                document.getElementById('output').style.display = 'none';
                updateStatus();
            }
        }

        // Keyboard shortcuts
        editor.commands.addCommand({
            name: 'save',
            bindKey: {win: 'Ctrl-S', mac: 'Command-S'},
            exec: saveFile
        });

        editor.commands.addCommand({
            name: 'run',
            bindKey: {win: 'Ctrl-Enter', mac: 'Command-Enter'},
            exec: runCode
        });

// Lesson navigation
let lessons = [];
let currentLessonIndex = 0;
let totalLessons = 0;

async function loadLessons() {
    const lessonContent = document.getElementById('lessonContent');
    
    try {
        // Show loading indicator
        lessonContent.innerHTML = `
            <div style="text-align: center; padding: 40px; color: #00ff00;">
                <div class="loading-animation" style="display: inline-block; margin-bottom: 10px;"></div>
                <p>Loading lessons...</p>
            </div>
        `;
        
        // Fetch lessons from JSON file
        const response = await fetch('lessons.json');
        
        if (!response.ok) {
            throw new Error(`Failed to load lessons: ${response.status} ${response.statusText}`);
        }
        
        const data = await response.json();
        lessons = data.lessons;
        totalLessons = lessons.length;
        
        // Update total lessons counter
        document.getElementById('totalLessons').textContent = totalLessons;
        
        // Load the first lesson
        if (lessons.length > 0) {
            currentLessonIndex = 0;
            displayLesson(currentLessonIndex);
        } else {
            throw new Error('No lessons found in the JSON file');
        }
        
    } catch (error) {
        console.error('Error loading lessons:', error);
        
        // Show error message
        lessonContent.innerHTML = `
            <div style="background: rgba(255, 0, 0, 0.1); border: 1px solid #ff0000; color: #ff4444; padding: 15px; border-radius: 5px; margin: 10px 0;">
                <h3>❌ Error Loading Lessons</h3>
                <p><strong>Error:</strong> ${error.message}</p>
                <p><strong>Make sure you have a 'lessons.json' file in the same directory.</strong></p>
            </div>
        `;
        
        // Reset counters
        document.getElementById('totalLessons').textContent = '--';
        document.getElementById('currentLesson').textContent = '--';
    }
}

// Add this function to display a specific lesson
function displayLesson(index) {
    const lessonContent = document.getElementById('lessonContent');
    const lessonTitle = document.getElementById('lessonTitle');
    
    if (index < 0 || index >= lessons.length) {
        console.error('Invalid lesson index:', index);
        return;
    }
    
    const lesson = lessons[index];
    
    // Update lesson title in header
    lessonTitle.textContent = lesson.title || `Lesson ${index + 1}`;
    
    // Build lesson content HTML
    let lessonHTML = `
        <div class="lesson-section">
            <h3>📖 ${lesson.title || `Lesson ${index + 1}`}</h3>
            ${lesson.difficulty ? `<p><strong>Difficulty:</strong> <span style="color: #00ff00;">${lesson.difficulty}</span></p>` : ''}
        </div>
    `;
    
    if (lesson.content) {
        lessonHTML += `
            <div class="lesson-section">
                <h3>📝 Content</h3>
                <div>${lesson.content}</div>
            </div>
        `;
    }
    
    if (lesson.objectives && lesson.objectives.length > 0) {
        lessonHTML += `
            <div class="lesson-section">
                <h3>🎯 Objectives</h3>
                <ul>
                    ${lesson.objectives.map(obj => `<li>${obj}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    if (lesson.code_example) {
        lessonHTML += `
            <div class="lesson-section">
                <h3>💻 Code Example</h3>
                <div class="code-example">${lesson.code_example.replace(/\\n/g, '\n')}</div>
                ${lesson.example_explanation ? `<p><strong>Explanation:</strong> ${lesson.example_explanation}</p>` : ''}
            </div>
        `;
    }
    
    if (lesson.exercises && lesson.exercises.length > 0) {
        lessonHTML += `
            <div class="lesson-section">
                <h3>🏋️ Exercises</h3>
                <ol>
                    ${lesson.exercises.map(exercise => `<li>${exercise}</li>`).join('')}
                </ol>
            </div>
        `;
    }
    
    if (lesson.tips && lesson.tips.length > 0) {
        lessonHTML += `
            <div class="lesson-section">
                <h3>💡 Tips</h3>
                <ul>
                    ${lesson.tips.map(tip => `<li>${tip}</li>`).join('')}
                </ul>
            </div>
        `;
    }
    
    // Set the lesson content
    lessonContent.innerHTML = lessonHTML;
    
    // Update lesson counter and navigation buttons
    updateLessonCounter();
    
    // Load code example into editor if available
    if (lesson.code_example && lesson.load_in_editor !== false) {
        editor.setValue(lesson.code_example.replace(/\\n/g, '\n'));
        editor.clearSelection();
        updateStatus();
    }
    
    // Scroll to top of lesson content
    lessonContent.scrollTop = 0;
}

function nextLesson() {
    if (currentLessonIndex < totalLessons - 1) {
        currentLessonIndex++;
        displayLesson(currentLessonIndex);
    }
}

function previousLesson() {
    if (currentLessonIndex > 0) {
        currentLessonIndex--;
        displayLesson(currentLessonIndex);
    }
}


         function updateLessonCounter() {
            document.getElementById('currentLesson').textContent = currentLessonIndex + 1;
            document.getElementById('totalLessons').textContent = totalLessons;
            
            // Update button states
            const prevBtn = document.querySelector('.nav-prev');
            const nextBtn = document.querySelector('.nav-next');
            
            prevBtn.disabled = currentLessonIndex === 0;
            nextBtn.disabled = currentLessonIndex === totalLessons - 1;
        }

        // Initialize everything
        createMatrixRain();
        updateTime();
        setInterval(updateTime, 1000);
        updateStatus();
        loadLessons();
    </script>
</body>
</html>
